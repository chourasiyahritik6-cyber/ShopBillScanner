name: Android Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip *.zip -d project_folder

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project Root and Generate Modern Gradle Wrapper
      run: |
        # Find where build.gradle or build.gradle.kts lives
        BUILD_GRADLE_PATH=$(find project_folder -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_GRADLE_PATH")
        echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
        
        # Download and configure a modern Gradle version (8.5) that supports Java 17
        cd "$PROJECT_ROOT"
        wget https://gradle.org
        unzip -q gradle-8.5-bin.zip
        export PATH=$PWD/gradle-8.5/bin:$PATH
        gradle wrapper --gradle-version 8.5

    - name: Build with Gradle
      run: |
        cd "$PROJECT_ROOT"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          project_folder/**/build/outputs/apk/debug/app-debug.apk
          project_folder/**/build/outputs/apk/debug/*.apk
