name: Android Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip *.zip -d project_folder

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project Root
      run: |
        BUILD_GRADLE_PATH=$(find project_folder -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_GRADLE_PATH")
        echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

    - name: Fix Java Version and AndroidX Properties
      run: |
        # Append AndroidX flags
        PROPERTIES_FILE="$PROJECT_ROOT/gradle.properties"
        touch "$PROPERTIES_FILE"
        echo "android.useAndroidX=true" >> "$PROPERTIES_FILE"
        echo "android.enableJetifier=true" >> "$PROPERTIES_FILE"
        
        # Automatically swap any hardcoded Java 1.8 targets with Java 17 inside the build files
        find project_folder -name "build.gradle" -type f -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} +
        find project_folder -name "build.gradle" -type f -exec sed -i "s/compatibility JavaVersion.VERSION_1_8/compatibility JavaVersion.VERSION_17/g" {} +
        find project_folder -name "build.gradle" -type f -exec sed -i "s/jvmTarget = '1.8'/jvmTarget = '17'/g" {} +

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Build with Gradle
      run: |
        cd "$PROJECT_ROOT"
        gradle assembleDebug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          project_folder/**/build/outputs/apk/debug/app-debug.apk
          project_folder/**/build/outputs/apk/debug/*.apk
