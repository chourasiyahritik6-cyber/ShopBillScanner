name: Android Build APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: unzip *.zip -d project_folder

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Find Project Root
      run: |
        BUILD_GRADLE_PATH=$(find project_folder -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
        PROJECT_ROOT=$(dirname "$BUILD_GRADLE_PATH")
        echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV

    - name: Configure AndroidX Properties
      run: |
        PROPERTIES_FILE="$PROJECT_ROOT/gradle.properties"
        touch "$PROPERTIES_FILE"
        echo "android.useAndroidX=true" >> "$PROPERTIES_FILE"
        echo "android.enableJetifier=true" >> "$PROPERTIES_FILE"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.9'

    - name: Create Global Gradle Force-Version Init Script
      run: |
        cat << 'EOF' > init.gradle
        allprojects {
            tasks.withType(JavaCompile) {
                sourceCompatibility = "17"
                targetCompatibility = "17"
            }
            tasks.configureEach { task ->
                if (task.class.name.contains("KotlinCompile")) {
                    task.compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                }
            }
        }
        EOF

    - name: Build with Gradle
      run: |
        cd "$PROJECT_ROOT"
        gradle assembleDebug --init-script ../init.gradle
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          project_folder/**/build/outputs/apk/debug/app-debug.apk
          project_folder/**/build/outputs/apk/debug/*.apk
